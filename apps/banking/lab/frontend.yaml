apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-frontend-nginx
  namespace: banking
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /frontend-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location = /config.js {
            default_type application/javascript;
            add_header Cache-Control "no-store, max-age=0" always;
            try_files /config.js =404;
        }

        location /user-api/ {
            proxy_pass http://user-service.banking.svc.cluster.local:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 60s;
        }

        # These fixed forwarded headers match the working production CORS setup.
        location /transaction-api/ {
            proxy_pass http://transaction-service.banking.svc.cluster.local:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host bank.techbleat-training.com;
            proxy_set_header X-Forwarded-Host bank.techbleat-training.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location /activity-api/ {
            proxy_pass http://activity-service.banking.svc.cluster.local:8001/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 60s;
        }

        location /finance-agent-api/ {
            proxy_pass http://finance-agent.banking.svc.cluster.local:9001/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-frontend-runtime
  namespace: banking
data:
  config.js: |
    window.__BANKING_CONFIG__ = {
      keycloakUrl: "https://auth.techbleat-training.com",
      keycloakRealm: "banking",
      keycloakClientId: "banking-frontend",
      bankingViewRole: "banking-customer",
      bankingTransactionRole: "banking-transact",
      bankingAiAgentRole: "banking-ai-agent"
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: banking
  labels:
    app: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: frontend
          image: ghcr.io/techbleat/sre2026-final-project/frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /frontend-health
              port: http
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /frontend-health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /frontend-health
              port: http
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap:
            name: banking-frontend-nginx
        - name: runtime-config
          configMap:
            name: banking-frontend-runtime
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: banking
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
