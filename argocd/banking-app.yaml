apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: techbleat-banking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/techbleat/techbleat-gitops.git
    targetRevision: main
    path: apps/banking/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: banking
  # Manual sync by default; pruning disabled for initial adoption.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
